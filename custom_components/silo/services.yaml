play:
  target:
    entity:
      integration: silo
      domain: media_player
  fields:
    content_id:
      required: true
      example: movie-tmdb-862
      selector:
        text:
    from_start:
      default: false
      selector:
        boolean:
    skip_if_playing:
      default: false
      selector:
        boolean:
    profile_id:
      advanced: true
      selector:
        text:
shuffle:
  target:
    entity:
      integration: silo
      domain: media_player
  fields:
    scope_id:
      required: true
      example: series-tvdb-353546
      selector:
        text:
    from_start:
      default: false
      selector:
        boolean:
    skip_if_playing:
      default: false
      selector:
        boolean:
    profile_id:
      advanced: true
      selector:
        text:
run_task:
  fields:
    task_key:
      required: true
      example: scan_libraries
      selector:
        text:
    config_entry_id:
      advanced: true
      selector:
        config_entry:
          integration: silo
send_message:
  target:
    entity:
      - integration: silo
        domain: media_player
      - integration: silo
        domain: sensor
        device_class: enum
  fields:
    message:
      required: true
      example: Bedtime in 5 minutes!
      selector:
        text:
    title:
      example: Bedtime
      selector:
        text:
stop_playback:
  target:
    entity:
      - integration: silo
        domain: media_player
      - integration: silo
        domain: sensor
        device_class: enum
